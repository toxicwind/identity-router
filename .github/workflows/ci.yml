name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Lint
        run: python -m ruff check src tests examples

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .
      - name: README quickstart smoke test
        run: |
          identity-router "Never ask to close a gap that tools can close" | grep -q "recommended"
          IDENTITY_ROUTER_IDENTITY=examples/identity-example.md identity-router-identity --json | grep -q '"name"'
